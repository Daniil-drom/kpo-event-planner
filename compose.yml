services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: event_planner
      POSTGRES_USER: planner
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Create .env from .env.example}
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    volumes:
      - planner-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U planner -d event_planner"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build:
      context: .
      target: runtime
    environment:
      DB_URL: jdbc:postgresql://db:5432/event_planner
      DB_USER: planner
      DB_PASSWORD: ${DB_PASSWORD:?Create .env from .env.example}
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 20

  db-test:
    image: postgres:17-alpine
    profiles: ["test"]
    environment:
      POSTGRES_DB: event_planner_test
      POSTGRES_USER: planner_test
      POSTGRES_PASSWORD: planner_test
    ports:
      - "127.0.0.1:15432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U planner_test -d event_planner_test"]
      interval: 3s
      timeout: 3s
      retries: 20

  tests:
    build:
      context: .
      target: tests
    profiles: ["test"]
    environment:
      TEST_DATABASE_URL: jdbc:postgresql://db-test:5432/event_planner_test
      TEST_DATABASE_USER: planner_test
      TEST_DATABASE_PASSWORD: planner_test
    volumes:
      - ./test-reports:/reports
    depends_on:
      db-test:
        condition: service_healthy

volumes:
  planner-data:
