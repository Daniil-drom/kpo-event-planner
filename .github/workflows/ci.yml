name: Build and tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: event_planner_test
          POSTGRES_USER: planner_test
          POSTGRES_PASSWORD: planner_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U planner_test -d event_planner_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: jdbc:postgresql://localhost:5432/event_planner_test
      TEST_DATABASE_USER: planner_test
      TEST_DATABASE_PASSWORD: planner_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build and verify
        run: mvn -B verify
      - name: Save test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/
          if-no-files-found: warn
