<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Планировщик мероприятий</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <header class="site-header"><a href="/" class="brand">Городские события</a></header>
  <main>
    <p class="eyebrow">Ваше свободное время</p>
    <h1>Планы начинаются с интересного события</h1>
    <p class="intro">Мероприятия Хельсинки на ближайшие 90 дней. Описания доступны на языке источника.</p>
    <section class="catalog" aria-labelledby="catalog-title">
      <div class="catalog-heading">
        <h2 id="catalog-title">Мероприятия</h2>
        <div class="city-field">
          <label for="city">Город</label>
          <select id="city" disabled><option>Загрузка городов…</option></select>
        </div>
      </div>
      <p id="notice" role="status" aria-live="polite"></p>
      <form id="filters">
        <label>Категория<select id="category"><option value="">Все категории</option></select></label>
        <label>С даты<input id="dateFrom" type="date"></label>
        <label>По дату<input id="dateTo" type="date"></label>
        <label class="check"><input id="free" type="checkbox"> Только бесплатно</label>
        <button type="submit">Показать</button>
      </form>
      <div id="events" class="event-grid"></div>
      <nav class="pagination" aria-label="Страницы каталога">
        <button id="prev" disabled>Назад</button><span id="page"></span><button id="next" disabled>Далее</button>
      </nav>
    </section>
    <dialog id="detail"><button id="close-detail" autofocus>Закрыть</button><div id="detail-content"></div></dialog>
  </main>
  <footer>Источник сведений о мероприятиях — <a href="https://api.hel.fi/linkedevents/v1/">Helsinki Linked Events</a></footer>
</body>
</html>
