spring:
  application:
    name: event-planner
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/event_planner}
    username: ${DB_USER:planner}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 5000
  flyway:
    enabled: true
  mvc:
    problemdetails:
      enabled: true
server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
linked-events:
  base-url: ${LINKED_EVENTS_BASE_URL:https://api.hel.fi/linkedevents/v1}
  sync-enabled: ${LINKED_EVENTS_SYNC_ENABLED:true}
  sync-delay-ms: ${LINKED_EVENTS_SYNC_DELAY_MS:3600000}
  horizon-days: ${LINKED_EVENTS_HORIZON_DAYS:90}
  max-pages: ${LINKED_EVENTS_MAX_PAGES:200}
